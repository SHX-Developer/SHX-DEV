<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHX — Developer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="scene.css">
<link rel="stylesheet" href="core-scene.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div class="cosmic-bg" id="cosmic-bg"></div>
<div class="cosmic-noise"></div>
<div id="particles-mount"></div>
<div id="root"></div>
<div id="tweaks-mount"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="scene.jsx"></script>
<script type="text/babel" src="core-scene.jsx"></script>
<script type="text/babel" src="boot.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "blue",
  "particleDensity": 2,
  "noise": true
}/*EDITMODE-END*/;

const ACCENTS = {
  purple: { p: '#7C3AED', ps: '#A78BFA', g1: 'rgba(124,58,237,0.45)', g2: 'rgba(56,189,248,0.10)' },
  blue:   { p: '#0EA5E9', ps: '#7DD3FC', g1: 'rgba(14,165,233,0.45)', g2: 'rgba(124,58,237,0.10)' },
  gold:   { p: '#F5C542', ps: '#FCD34D', g1: 'rgba(245,197,66,0.35)', g2: 'rgba(124,58,237,0.18)' },
  magenta:{ p: '#E11D74', ps: '#F472B6', g1: 'rgba(225,29,116,0.40)', g2: 'rgba(56,189,248,0.10)' },
};

function applyAccent(key) {
  const a = ACCENTS[key] || ACCENTS.purple;
  const r = document.documentElement;
  r.style.setProperty('--purple', a.p);
  r.style.setProperty('--purple-soft', a.ps);
  // Tweak the bg radial accents
  const bg = document.getElementById('cosmic-bg');
  if (bg) {
    bg.style.background = `
      radial-gradient(ellipse 80% 60% at 50% -10%, ${a.g1}, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 30%, ${a.g2}, transparent 60%),
      radial-gradient(ellipse 70% 50% at 10% 80%, ${a.g1.replace('0.45','0.18').replace('0.40','0.16').replace('0.35','0.14')}, transparent 60%),
      linear-gradient(180deg, #05030D 0%, #0A0617 40%, #05030D 100%)
    `;
  }
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => { applyAccent(tweaks.accent); }, [tweaks.accent]);
  useEffect(() => {
    document.querySelector('.cosmic-noise').style.display = tweaks.noise ? '' : 'none';
  }, [tweaks.noise]);

  return (
    <>
      <Nav />
      <main>
        <Hero />
        <About />
        <Projects />
        <TechStack />
        <Services />
        <Process />
        <Experience />
        <Resume />
        <Contact />
        <Footer />
      </main>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Accent">
          <TweakRadio
            label="Color"
            value={tweaks.accent}
            onChange={(v) => setTweak('accent', v)}
            options={[
              { value: 'purple',  label: 'Purple' },
              { value: 'blue',    label: 'Cyan' },
              { value: 'gold',    label: 'Gold' },
              { value: 'magenta', label: 'Mag' },
            ]}
          />
        </TweakSection>
        <TweakSection label="Atmosphere">
          <TweakSlider
            label="Particles"
            min={0} max={2} step={0.1}
            value={tweaks.particleDensity}
            onChange={(v) => setTweak('particleDensity', v)}
          />
          <TweakToggle
            label="Film grain"
            value={tweaks.noise}
            onChange={(v) => setTweak('noise', v)}
          />
        </TweakSection>
      </TweaksPanel>

      <ParticlesPortal density={tweaks.particleDensity}/>
      <BootSequence/>
    </>
  );
}

function ParticlesPortal({ density }) {
  return ReactDOM.createPortal(<ParticlesBg density={density} speed={1}/>, document.getElementById('particles-mount'));
}

// Mount once everything is loaded
const tryMount = () => {
  if (typeof Hero === 'undefined' || typeof TweaksPanel === 'undefined' || typeof useTweaks === 'undefined') {
    setTimeout(tryMount, 30);
    return;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
};
tryMount();
</script>

</body>
</html>
