name: Deploy

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: site

jobs:
  build-artifact:
    name: Build deploy artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: shx-dev-static
          path: site/dist
          retention-days: 14
