<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>shx.dev — building systems beyond reality</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0: #05010A;
    --bg-1: #090014;
    --bg-2: #120021;
    --bg-3: #1a0530;

    --p-1: #A855F7;
    --p-2: #C084FC;
    --p-3: #7C3AED;
    --p-4: #6D28D9;

    --glow: 168 85 247;
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.08);
    --hairline: rgba(255,255,255,0.08);
    --hairline-strong: rgba(255,255,255,0.14);

    --text-0: #F5F0FF;
    --text-1: #C9C3D9;
    --text-2: #8A839A;
    --text-3: #4E4860;

    --font-sans: "Geist", system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --font-serif: "Instrument Serif", "Times New Roman", serif;

    --particle-density: 1;
    --glow-intensity: 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--font-sans);
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
    line-height: 1.5;
  }

  /* Global cosmic gradient layer */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 1200px 800px at 80% -10%, rgba(124,58,237,0.18), transparent 60%),
      radial-gradient(ellipse 900px 600px at -10% 30%, rgba(168,85,247,0.10), transparent 60%),
      radial-gradient(ellipse 1400px 800px at 50% 110%, rgba(192,132,252,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, #07000f 100%);
    z-index: -3;
    pointer-events: none;
  }

  /* Star field (cheap CSS pseudo) */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 85% 15%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 75% 45%, rgba(192,132,252,0.6), transparent),
      radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 95% 65%, rgba(168,85,247,0.5), transparent),
      radial-gradient(1px 1px at 45% 5%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 55% 95%, rgba(255,255,255,0.5), transparent);
    background-size: 100% 100%;
    z-index: -2;
    pointer-events: none;
    opacity: calc(0.9 * var(--particle-density));
  }

  /* Mouse glow */
  .mouse-glow {
    position: fixed;
    pointer-events: none;
    width: 600px; height: 600px;
    border-radius: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(var(--glow),0.18) 0%, rgba(var(--glow),0.06) 35%, transparent 70%);
    filter: blur(20px);
    z-index: -1;
    opacity: calc(0.8 * var(--glow-intensity));
    mix-blend-mode: screen;
    transition: opacity .3s;
    will-change: transform;
  }

  /* ---------- TYPOGRAPHY ---------- */
  h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0; }

  .display {
    font-size: clamp(48px, 7.5vw, 132px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 0.96;
    text-wrap: balance;
  }
  .display .ital {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #E9D5FF 0%, var(--p-1) 60%, var(--p-3) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .display .white {
    background: linear-gradient(180deg, #fff 0%, #BDB5D1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .h-section {
    font-size: clamp(32px, 4vw, 56px);
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.02;
  }
  .h-section .ital {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(180deg, #E9D5FF, var(--p-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--p-2);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--p-1);
    box-shadow: 0 0 12px var(--p-1);
  }

  .mono { font-family: var(--font-mono); }
  .muted { color: var(--text-1); }
  .dim { color: var(--text-2); }

  /* ---------- LAYOUT ---------- */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
  }
  @media (max-width: 720px) {
    .container { padding: 0 20px; }
  }

  section {
    position: relative;
    padding: 140px 0;
  }
  @media (max-width: 720px) {
    section { padding: 90px 0; }
  }

  /* ---------- GLASS ---------- */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    position: relative;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(140deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 40%, rgba(168,85,247,0.25));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* ---------- BUTTONS ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, background .25s;
    text-decoration: none;
    color: inherit;
    user-select: none;
  }
  .btn-primary {
    background: linear-gradient(180deg, var(--p-1), var(--p-3));
    color: white;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.12) inset,
      0 8px 30px rgba(168,85,247,0.45),
      0 0 60px rgba(168,85,247,0.25);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.2) inset,
      0 12px 40px rgba(168,85,247,0.55),
      0 0 80px rgba(168,85,247,0.4);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid var(--hairline-strong);
    color: var(--text-0);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(168,85,247,0.4);
    transform: translateY(-1px);
  }
  .btn .arrow {
    transition: transform .25s;
  }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ---------- PILL CHIP ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid var(--hairline);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-1);
  }
  .chip .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--p-2);
    box-shadow: 0 0 10px var(--p-2);
  }

  /* ---------- REVEAL ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    filter: blur(6px);
    transition: opacity 1s cubic-bezier(.2,.7,.3,1), transform 1s cubic-bezier(.2,.7,.3,1), filter 1s;
    transition-delay: var(--reveal-delay, 0ms);
  }
  .reveal.in {
    opacity: 1;
    transform: none;
    filter: none;
  }

  /* ---------- BLACK HOLE ---------- */
  .blackhole-wrap {
    position: absolute;
    left: 50%; bottom: -8%;
    transform: translateX(-50%);
    width: min(1100px, 110vw);
    aspect-ratio: 1.3 / 1;
    pointer-events: none;
    z-index: 0;
  }
  .blackhole {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%,
        #000 0%, #000 22%,
        rgba(0,0,0,0.95) 24%,
        rgba(168,85,247,0.55) 27%,
        rgba(255,255,255,0.95) 30%,
        rgba(192,132,252,0.85) 33%,
        rgba(168,85,247,0.45) 38%,
        rgba(124,58,237,0.20) 46%,
        rgba(124,58,237,0.06) 60%,
        transparent 75%);
    filter: blur(0.4px) saturate(1.2);
    transform: rotateX(72deg) rotateZ(0deg);
    animation: hole-spin 30s linear infinite;
  }
  .blackhole::after {
    content: "";
    position: absolute; inset: 14% 0;
    border-radius: 50%;
    background: radial-gradient(circle, #000 0%, #000 36%, transparent 60%);
    filter: blur(2px);
  }
  .blackhole-glow {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(168,85,247,0.45) 0%, transparent 50%);
    filter: blur(40px);
    animation: glow-pulse 6s ease-in-out infinite;
    opacity: calc(0.9 * var(--glow-intensity));
  }
  @keyframes hole-spin { from { transform: rotateX(72deg) rotateZ(0deg); } to { transform: rotateX(72deg) rotateZ(360deg); } }
  @keyframes glow-pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

  /* ---------- NAV ---------- */
  .nav-fixed {
    position: fixed;
    top: 16px; left: 0; right: 0;
    z-index: 100;
    display: flex; justify-content: center;
    pointer-events: none;
  }
  .nav-pill {
    pointer-events: auto;
    display: flex; align-items: center; gap: 4px;
    padding: 8px 8px 8px 20px;
    border-radius: 999px;
    background: rgba(8,4,16,0.55);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--hairline-strong);
    box-shadow: 0 16px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.04);
    transition: padding .3s, transform .3s, box-shadow .3s;
  }
  .nav-pill.shrunk {
    padding: 6px 6px 6px 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 60px rgba(168,85,247,0.18);
  }
  .nav-brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-0);
    margin-right: 18px;
  }
  .nav-brand .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4cc4ff;
    box-shadow: 0 0 12px #4cc4ff;
  }
  .nav-brand .tld { color: var(--text-2); }
  .nav-sep {
    width: 1px; height: 18px;
    background: var(--hairline-strong);
    margin: 0 14px 0 0;
  }
  .nav-links { display: flex; align-items: center; gap: 2px; margin-right: 6px; }
  .nav-link {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-1);
    text-decoration: none;
    transition: color .2s, background .2s;
  }
  .nav-link:hover { color: var(--text-0); background: rgba(255,255,255,0.04); }
  .nav-cta {
    padding: 10px 18px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--p-1), var(--p-3));
    color: white;
    font-size: 14px;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    text-decoration: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset, 0 4px 20px rgba(168,85,247,0.4);
    transition: transform .2s, box-shadow .2s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 6px 28px rgba(168,85,247,0.6); }

  @media (max-width: 880px) {
    .nav-links { display: none; }
    .nav-sep { display: none; }
  }

  /* ---------- SECTION HEADERS ---------- */
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 56px; }
  .section-head p { color: var(--text-2); max-width: 420px; }
  @media (max-width: 720px) {
    .section-head { flex-direction: column; align-items: flex-start; gap: 16px; }
  }

  /* Utility */
  .grid { display: grid; }
  .stack { display: flex; flex-direction: column; }
  .row { display: flex; }
  .center { display: flex; align-items: center; justify-content: center; }

  .selection ::selection, ::selection {
    background: rgba(168,85,247,0.4);
    color: white;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.5); }

  /* Reduce motion */
  body.no-motion .blackhole { animation: none; }
  body.no-motion .blackhole-glow { animation: none; }
  body.no-motion .reveal { transition: none; opacity: 1; transform: none; filter: none; }
  body.no-motion .mouse-glow { display: none; }
</style>
</head>
<body class="selection">

<div id="root"></div>
<div class="mouse-glow" id="mouseGlow"></div>

</body>
